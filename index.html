<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가상 형광 핵형 분석실</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 커스텀 애니메이션 및 스크롤바 스타일 */
    @keyframes hardShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10%, 30%, 50%, 70%, 90% { transform: translate(-8px, -2px) rotate(-1deg); }
      20%, 40%, 60%, 80% { transform: translate(8px, 2px) rotate(1deg); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    .error-shake { animation: hardShake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    .bg-alert { background-color: rgba(185, 28, 28, 0.4) !important; transition: background-color 0.1s; }
    .bg-dark-karyotype { background-color: #0b0c10; }
    .floating { animation: float 3s ease-in-out infinite; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  </style>
</head>
<body class="bg-gray-900 text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SPECIES_DATA = {
      frog: {
        id: 'frog', name: '아프리카발톱개구리', diploid: 36,
        femaleSex: 'ZZ', maleSex: 'ZW',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🐸'
      },
      fly: {
        id: 'fly', name: '노랑초파리', diploid: 8,
        femaleSex: 'XX', maleSex: 'XY',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🪰'
      },
      chimp: {
        id: 'chimp', name: '침팬지', diploid: 48,
        femaleSex: 'XX', maleSex: 'XY',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🦧'
      },
      gorilla: {
        id: 'gorilla', name: '고릴라', diploid: 48,
        femaleSex: 'XX', maleSex: 'XY',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🦍'
      }
    };

    const generateIdealPlaced = (species, gender) => {
      const idealPlaced = {};
      const autosomePairs = (species.diploid - 2) / 2;

      for (let i = 1; i <= autosomePairs; i++) {
        const sizeMulti = 1 - ((i - 1) / autosomePairs) * 0.6;
        idealPlaced[i.toString()] = [
          { id: `ideal-${gender}-a${i}-1`, type: 'A', slot: i.toString(), size: sizeMulti },
          { id: `ideal-${gender}-a${i}-2`, type: 'A', slot: i.toString(), size: sizeMulti }
        ];
      }

      const sexChromosomes = [];
      if (species.id === 'frog') {
        if (gender === 'female') {
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'Z', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'Z', slot: 'sex', size: 0.9 });
        } else {
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'Z', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'W', slot: 'sex', size: 0.4 });
        }
      } else {
        if (gender === 'female') {
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'X', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'X', slot: 'sex', size: 0.9 });
        } else {
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'X', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'Y', slot: 'sex', size: 0.35 });
        }
      }
      idealPlaced['sex'] = sexChromosomes;
      
      return idealPlaced;
    };

    const FluorescentChromosome = ({ sizeMultiplier, type, slot, showHint }) => {
      const height = Math.max(30, 95 * sizeMultiplier);
      const width = Math.max(14, 26 * Math.sqrt(sizeMultiplier));
      const isSexSmall = type === 'Y' || type === 'W';
      
      let centromerePos = 0.45;
      let seed = 0;
      
      if (type === 'A') {
        const num = parseInt(slot) || 1;
        seed = num;
        const positions = [0.45, 0.25, 0.15, 0.4, 0.3, 0.2, 0.48, 0.18];
        centromerePos = positions[(num - 1) % positions.length];
      } else if (isSexSmall) {
        centromerePos = 0.2;
        seed = 99;
      } else {
        centromerePos = 0.35;
        seed = 100;
      }

      const cy = height * centromerePos;
      const gradientId = `grad-${type}-${slot}-${Math.random().toString(36).substr(2, 5)}`;
      const colorPalettes = [
        ['#fca5a5', '#86efac', '#fde047', '#93c5fd', '#fca5a5'],
        ['#fdba74', '#fbcfe8', '#67e8f9', '#d8b4fe', '#fdba74'],
        ['#86efac', '#fde047', '#93c5fd', '#fca5a5', '#86efac'],
        ['#d8b4fe', '#fdba74', '#86efac', '#fbcfe8', '#d8b4fe'],
        ['#67e8f9', '#fca5a5', '#d8b4fe', '#fde047', '#67e8f9'],
        ['#fde047', '#93c5fd', '#fca5a5', '#86efac', '#fde047']
      ];
      
      let colors = colorPalettes[seed % colorPalettes.length];
      if (isSexSmall) colors = ['#ec4899', '#fef08a', '#ec4899', '#fef08a', '#ec4899'];
      else if (type === 'X' || type === 'Z') colors = ['#a855f7', '#86efac', '#fde047', '#a855f7', '#86efac'];
      
      return (
        <div className="relative cursor-grab active:cursor-grabbing hover:scale-125 transition-transform drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]" style={{ width: `${width}px`, height: `${height}px` }}>
          {showHint && (
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 text-yellow-300 text-[11px] font-bold px-1.5 py-0.5 rounded border border-yellow-500/50 pointer-events-none z-10 backdrop-blur-sm">
              {slot === 'sex' ? type : slot}
            </div>
          )}
          <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
            <defs>
              <linearGradient id={gradientId} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={colors[0]} />
                <stop offset="25%" stopColor={colors[1]} />
                <stop offset="50%" stopColor={colors[2]} />
                <stop offset="75%" stopColor={colors[3]} />
                <stop offset="100%" stopColor={colors[4]} />
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1.5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>
            <g filter="url(#glow)">
              <path d={`M ${width*0.3} 2 Q ${width*0.2} ${cy/2} ${width*0.35} ${cy} Q ${width*0.25} ${cy + (height-cy)/2} ${width*0.3} ${height-2} Q ${width*0.45} ${height-2} ${width*0.45} ${cy + (height-cy)/2} Q ${width*0.4} ${cy} ${width*0.5} ${cy/2} Q ${width*0.45} 2 ${width*0.3} 2 Z`} fill={`url(#${gradientId})`} opacity="0.9" />
              <path d={`M ${width*0.7} 2 Q ${width*0.6} ${cy/2} ${width*0.75} ${cy} Q ${width*0.65} ${cy + (height-cy)/2} ${width*0.7} ${height-2} Q ${width*0.85} ${height-2} ${width*0.85} ${cy + (height-cy)/2} Q ${width*0.8} ${cy} ${width*0.9} ${cy/2} Q ${width*0.85} 2 ${width*0.7} 2 Z`} fill={`url(#${gradientId})`} opacity="0.9" />
              <ellipse cx={width/2} cy={cy} rx={width*0.25} ry="2" fill="#ffffff" opacity="0.8" />
            </g>
          </svg>
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState('HOME'); 
      const [selectedSpecies, setSelectedSpecies] = useState(null);
      const [selectedGender, setSelectedGender] = useState(null);
      
      const [chromosomes, setChromosomes] = useState([]);
      const [placed, setPlaced] = useState({});
      const [globalError, setGlobalError] = useState(false);
      const [quizError, setQuizError] = useState(false);
      const [showHint, setShowHint] = useState(false); 
      const [quizForm, setQuizForm] = useState({ formula: '', femaleZyg: '', maleZyg: '' });

      const triggerError = () => {
        setGlobalError(true);
        setTimeout(() => setGlobalError(false), 600);
      };

      const startGame = (speciesId, gender) => {
        const species = SPECIES_DATA[speciesId];
        const newChromosomes = [];
        const autosomePairs = (species.diploid - 2) / 2;

        for (let i = 1; i <= autosomePairs; i++) {
          const sizeMulti = 1 - ((i - 1) / autosomePairs) * 0.6; 
          newChromosomes.push({ id: `a${i}-1`, type: 'A', slot: i.toString(), size: sizeMulti });
          newChromosomes.push({ id: `a${i}-2`, type: 'A', slot: i.toString(), size: sizeMulti });
        }

        if (speciesId === 'frog') {
          if (gender === 'female') {
            newChromosomes.push({ id: `s-1`, type: 'Z', slot: 'sex', size: 0.9 });
            newChromosomes.push({ id: `s-2`, type: 'Z', slot: 'sex', size: 0.9 });
          } else {
            newChromosomes.push({ id: `s-1`, type: 'Z', slot: 'sex', size: 0.9 });
            newChromosomes.push({ id: `s-2`, type: 'W', slot: 'sex', size: 0.4 });
          }
        } else {
          if (gender === 'female') {
            newChromosomes.push({ id: `s-1`, type: 'X', slot: 'sex', size: 0.9 });
            newChromosomes.push({ id: `s-2`, type: 'X', slot: 'sex', size: 0.9 });
          } else {
            newChromosomes.push({ id: `s-1`, type: 'X', slot: 'sex', size: 0.9 });
            newChromosomes.push({ id: `s-2`, type: 'Y', slot: 'sex', size: 0.35 });
          }
        }

        const shuffled = newChromosomes.sort(() => Math.random() - 0.5).map(chr => ({
          ...chr,
          delay: `${Math.random() * 2}s`,
          rotate: `${(Math.random() - 0.5) * 40}deg`
        }));

        setChromosomes(shuffled);
        setPlaced({});
        setSelectedSpecies(species);
        setSelectedGender(gender);
        setQuizForm({ formula: '', femaleZyg: '', maleZyg: '' });
        setShowHint(false);
        setStep('KARYOTYPE');
      };

      const handleDragStart = (e, chr) => {
        e.dataTransfer.setData('chr', JSON.stringify(chr));
      };

      const handleDrop = (e, targetSlot) => {
        e.preventDefault();
        const chrData = e.dataTransfer.getData('chr');
        if (!chrData) return;
        
        const chr = JSON.parse(chrData);

        if (chr.slot !== targetSlot || (placed[targetSlot] && placed[targetSlot].length >= 2)) {
          triggerError();
          return;
        }

        setPlaced(prev => ({
          ...prev,
          [targetSlot]: [...(prev[targetSlot] || []), chr]
        }));
        setChromosomes(prev => prev.filter(c => c.id !== chr.id));
      };

      const submitQuiz = () => {
        const cleanFormula = quizForm.formula.replace(/\s/g, '').toLowerCase();
        const correctFormula = `2n=${selectedSpecies.diploid}`;
        
        if (cleanFormula !== correctFormula || 
            quizForm.femaleZyg !== selectedSpecies.femaleZyg || 
            quizForm.maleZyg !== selectedSpecies.maleZyg) {
          setQuizError(true);
          setTimeout(() => setQuizError(false), 600);
          return;
        }

        setStep('RESULT');
      };

      if (step === 'HOME') {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-6 text-white">
            <h1 className="text-4xl md:text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
              🔬 가상 형광 핵형 분석실
            </h1>
            <p className="text-gray-400 mb-10 text-lg">분석을 진행할 종을 선택해 주세요.</p>
            
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl w-full">
              {Object.values(SPECIES_DATA).map(species => (
                <div 
                  key={species.id}
                  onClick={() => { setSelectedSpecies(species); setStep('GENDER'); }}
                  className="group cursor-pointer bg-gray-800 border-2 border-gray-700 rounded-xl p-6 flex flex-col items-center hover:bg-gray-700 hover:border-cyan-400 transition-all shadow-2xl relative overflow-hidden"
                >
                  <div className="absolute inset-0 bg-gradient-to-b from-transparent to-cyan-900/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                  <div className="text-6xl mb-4 group-hover:scale-110 transition-transform">{species.image}</div>
                  <h2 className="text-xl font-bold">{species.name}</h2>
                  <span className="mt-2 px-3 py-1 bg-gray-900 rounded-full text-xs text-cyan-300 border border-gray-600 group-hover:border-cyan-400">
                    선택하기
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      if (step === 'GENDER') {
        return (
          <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-6 text-white">
            <div className="bg-gray-800 p-10 rounded-2xl shadow-2xl border border-gray-700 text-center max-w-md w-full">
              <div className="text-5xl mb-4">{selectedSpecies.image}</div>
              <h2 className="text-3xl font-bold mb-8">{selectedSpecies.name}</h2>
              <div className="flex gap-4 mb-6">
                <button 
                  onClick={() => startGame(selectedSpecies.id, 'female')}
                  className="flex-1 py-4 bg-pink-900/50 hover:bg-pink-800 text-pink-300 rounded-xl border border-pink-700 transition font-bold text-lg"
                >
                  ♀ 암컷 분석
                </button>
                <button 
                  onClick={() => startGame(selectedSpecies.id, 'male')}
                  className="flex-1 py-4 bg-blue-900/50 hover:bg-blue-800 text-blue-300 rounded-xl border border-blue-700 transition font-bold text-lg"
                >
                  ♂ 수컷 분석
                </button>
              </div>
              <button onClick={() => setStep('HOME')} className="text-gray-400 hover:text-white underline text-sm">뒤로 가기</button>
            </div>
          </div>
        );
      }

      if (step === 'KARYOTYPE') {
        const isFinished = chromosomes.length === 0;
        const autosomePairs = (selectedSpecies.diploid - 2) / 2;
        const slots = Array.from({ length: autosomePairs }, (_, i) => (i + 1).toString());

        return (
          <div className={`flex flex-col min-h-screen bg-dark-karyotype transition-colors duration-200 ${globalError ? 'bg-alert error-shake' : ''}`}>
            
            {globalError && (
               <div className="absolute inset-0 pointer-events-none z-50 border-[8px] border-red-600 opacity-80 mix-blend-screen"></div>
            )}

            <header className="bg-gray-900 text-white p-4 shadow-lg flex justify-between items-center border-b border-gray-800 z-10">
              <div>
                <h1 className="text-xl font-bold text-cyan-400">
                  {selectedSpecies.name} ({selectedGender === 'female' ? '암컷' : '수컷'}) 핵형 분석 중...
                </h1>
                <p className="text-xs text-gray-400 mt-1">염색체의 크기와 모양을 관찰하여 알맞은 번호 슬롯으로 드래그하세요.</p>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setShowHint(!showHint)} 
                  className={`px-4 py-2 text-sm rounded border transition-colors ${showHint ? 'bg-yellow-500/20 text-yellow-300 border-yellow-500/50' : 'bg-gray-800 text-gray-300 hover:bg-gray-700 border-gray-600'}`}
                >
                  {showHint ? '💡 힌트 끄기' : '💡 힌트 보기'}
                </button>
                <button onClick={() => setStep('HOME')} className="px-4 py-2 bg-gray-800 text-sm rounded hover:bg-gray-700 border border-gray-600">중단하기</button>
              </div>
            </header>

            <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
              <div className="w-full lg:w-[350px] bg-gray-900/50 border-r border-gray-800 relative flex flex-col">
                {!isFinished ? (
                  <div className="p-4 overflow-y-auto flex flex-wrap content-start justify-center gap-4 h-full">
                    <div className="w-full text-center text-gray-500 font-bold mb-4 border-b border-gray-700 pb-2">분류 대기 중인 염색체</div>
                    {chromosomes.map(chr => (
                      <div 
                        key={chr.id} draggable onDragStart={(e) => handleDragStart(e, chr)}
                        className="floating p-2 rounded hover:bg-white/10"
                        style={{ animationDelay: chr.delay, transform: `rotate(${chr.rotate})` }}
                      >
                        <FluorescentChromosome sizeMultiplier={chr.size} type={chr.type} slot={chr.slot} showHint={showHint} />
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="p-6 overflow-y-auto h-full flex flex-col justify-center">
                    <div className={`bg-gray-800 border border-gray-600 rounded-2xl shadow-xl p-6 relative transition-all ${quizError ? 'error-shake border-red-500' : ''}`}>
                      
                      {quizError && (
                        <div className="absolute -top-4 left-1/2 -translate-x-1/2 w-[90%] text-center z-10">
                          <span className="bg-red-600 text-white text-sm font-bold px-4 py-1.5 rounded-full shadow-lg animate-pulse whitespace-nowrap">
                            오답입니다! 우측 보드를 다시 확인하세요.
                          </span>
                        </div>
                      )}
                      
                      <h2 className="text-xl font-bold mb-6 text-center text-white">✅ 최종 보고서 작성</h2>
                      
                      <div className="space-y-6">
                        <div>
                          <label className="block text-sm font-bold text-gray-300 mb-2">1. 핵상 입력 (예: 2n=46)</label>
                          <input 
                            type="text" value={quizForm.formula} onChange={e => setQuizForm({...quizForm, formula: e.target.value})}
                            placeholder="여기에 적어주세요"
                            className="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-cyan-500 focus:outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-bold text-gray-300 mb-2">2. 암컷 성염색체 접합 상태</label>
                          <select 
                            value={quizForm.femaleZyg} onChange={e => setQuizForm({...quizForm, femaleZyg: e.target.value})}
                            className="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-cyan-500 focus:outline-none appearance-none"
                          >
                            <option value="">선택하세요</option>
                            <option value="동형접합자">동형접합자</option>
                            <option value="이형접합자">이형접합자</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-sm font-bold text-gray-300 mb-2">3. 수컷 성염색체 접합 상태</label>
                          <select 
                            value={quizForm.maleZyg} onChange={e => setQuizForm({...quizForm, maleZyg: e.target.value})}
                            className="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 focus:border-cyan-500 focus:outline-none appearance-none"
                          >
                            <option value="">선택하세요</option>
                            <option value="동형접합자">동형접합자</option>
                            <option value="이형접합자">이형접합자</option>
                          </select>
                        </div>

                        <button 
                          onClick={submitQuiz}
                          className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition-colors shadow-[0_0_15px_rgba(8,145,178,0.5)]"
                        >
                          제출 및 결과 보기
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div className="flex-1 p-6 overflow-y-auto relative">
                 <div className="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-6 max-w-7xl mx-auto">
                    {slots.map(slotId => (
                      <div 
                        key={slotId} onDragOver={e => e.preventDefault()} onDrop={e => handleDrop(e, slotId)}
                        className="flex flex-col items-center justify-end h-[120px] rounded-lg border border-gray-800 bg-gray-900/30 hover:bg-gray-800/80 transition-colors pb-2 relative"
                      >
                        <div className="flex gap-2 items-end justify-center h-[90px] w-full px-2">
                          {(placed[slotId] || []).map(chr => (
                            <FluorescentChromosome key={chr.id} sizeMultiplier={chr.size} type={chr.type} slot={slotId} />
                          ))}
                        </div>
                        <span className="text-gray-500 font-bold mt-2 text-sm">{slotId}</span>
                      </div>
                    ))}
                    
                    <div 
                      onDragOver={e => e.preventDefault()} onDrop={e => handleDrop(e, 'sex')}
                      className="col-span-2 flex flex-col items-center justify-end h-[120px] rounded-lg border border-cyan-900/50 bg-cyan-900/10 hover:bg-cyan-900/30 transition-colors pb-2"
                    >
                      <div className="flex gap-4 items-end justify-center h-[90px] w-full">
                        {(placed['sex'] || []).map(chr => (
                          <FluorescentChromosome key={chr.id} sizeMultiplier={chr.size} type={chr.type} slot="sex" />
                        ))}
                      </div>
                      <span className="text-cyan-600 font-black mt-2 text-sm border-t border-cyan-900/50 pt-1 px-4">성염색체</span>
                    </div>
                 </div>
              </div>
            </div>
          </div>
        );
      }

      if (step === 'RESULT') {
        const autosomePairs = (selectedSpecies.diploid - 2) / 2;
        const slots = Array.from({ length: autosomePairs }, (_, i) => (i + 1).toString());

        const femalePlaced = selectedGender === 'female' ? placed : generateIdealPlaced(selectedSpecies, 'female');
        const malePlaced = selectedGender === 'male' ? placed : generateIdealPlaced(selectedSpecies, 'male');

        return (
          <div className="min-h-screen bg-gray-900 p-8 flex flex-col items-center text-white">
            <div className="bg-gray-800 border border-gray-700 max-w-7xl w-full rounded-2xl shadow-2xl overflow-hidden">
              
              <div className="bg-gradient-to-r from-cyan-900 to-blue-900 p-8 text-center border-b border-cyan-800">
                <h1 className="text-3xl font-black mb-2 text-cyan-100">✨ {selectedSpecies.name} 최종 핵형 분석 결과 ✨</h1>
                <p className="text-cyan-300/80">정확하게 분류를 완료하고 특징을 파악했습니다.</p>
              </div>
              
              <div className="p-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
                <div className="lg:col-span-1 space-y-4">
                  <div className="bg-gray-900 rounded-xl p-6 border border-gray-700 h-full">
                    <h2 className="text-xl font-bold border-b border-gray-700 pb-3 mb-5 text-cyan-400">분석 내용</h2>
                    <div className="space-y-6">
                      <div>
                        <p className="text-gray-500 text-sm mb-1">입력한 핵상</p>
                        <p className="text-2xl font-bold text-white">{quizForm.formula}</p>
                      </div>
                      <div>
                        <p className="text-gray-500 text-sm mb-1">암컷 성염색체 (정답)</p>
                        <p className="text-lg font-bold text-pink-400">{selectedSpecies.femaleSex} <span className="text-sm font-normal">({quizForm.femaleZyg})</span></p>
                      </div>
                      <div>
                        <p className="text-gray-500 text-sm mb-1">수컷 성염색체 (정답)</p>
                        <p className="text-lg font-bold text-blue-400">{selectedSpecies.maleSex} <span className="text-sm font-normal">({quizForm.maleZyg})</span></p>
                      </div>
                      <div className="pt-4 border-t border-gray-700">
                        <p className="text-gray-500 text-sm mb-1">분석한 개체의 성별</p>
                        <p className="text-xl font-bold text-yellow-400">
                          {selectedGender === 'female' ? `암컷 (${selectedSpecies.femaleSex})` : `수컷 (${selectedSpecies.maleSex})`}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-3 bg-gray-900 rounded-xl p-6 border border-gray-700 flex flex-col gap-6">
                   <div>
                     <h2 className="text-lg font-bold border-b border-gray-700 pb-2 mb-4 text-pink-400">♀ 암컷 Karyotype Map ({selectedSpecies.femaleSex})</h2>
                     <div className="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 gap-y-6 gap-x-2">
                      {slots.map(slotId => (
                        <div key={`f-${slotId}`} className="flex flex-col items-center justify-end pb-1 border-b border-gray-800">
                          <div className="flex gap-1 items-end justify-center h-[55px]">
                            {(femalePlaced[slotId] || []).map(chr => (
                              <div key={chr.id} className="scale-75 origin-bottom">
                                 <FluorescentChromosome sizeMultiplier={chr.size} type={chr.type} slot={slotId} />
                              </div>
                            ))}
                          </div>
                          <span className="mt-1 text-[10px] font-bold text-gray-500">{slotId}</span>
                        </div>
                      ))}
                      <div className="col-span-2 flex flex-col items-center justify-end pb-1 border-b border-pink-800/50 bg-pink-900/10 rounded-t">
                        <div className="flex gap-3 items-end justify-center h-[55px]">
                          {(femalePlaced['sex'] || []).map(chr => (
                            <div key={chr.id} className="scale-75 origin-bottom">
                               <FluorescentChromosome sizeMultiplier={chr.size} type={chr.type} slot="sex" />
                            </div>
                          ))}
                        </div>
                        <span className="mt-1 text-[10px] font-bold text-pink-500">성염색체</span>
                      </div>
                     </div>
                   </div>

                   <div>
                     <h2 className="text-lg font-bold border-b border-gray-700 pb-2 mb-4 text-blue-400">♂ 수컷 Karyotype Map ({selectedSpecies.maleSex})</h2>
                     <div className="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 gap-y-6 gap-x-2">
                      {slots.map(slotId => (
                        <div key={`m-${slotId}`} className="flex flex-col items-center justify-end pb-1 border-b border-gray-800">
                          <div className="flex gap-1 items-end justify-center h-[55px]">
                            {(malePlaced[slotId] || []).map(chr => (
                              <div key={chr.id} className="scale-75 origin-bottom">
                                 <FluorescentChromosome sizeMultiplier={chr.size} type={chr.type} slot={slotId} />
                              </div>
                            ))}
                          </div>
                          <span className="mt-1 text-[10px] font-bold text-gray-500">{slotId}</span>
                        </div>
                      ))}
                      <div className="col-span-2 flex flex-col items-center justify-end pb-1 border-b border-blue-800/50 bg-blue-900/10 rounded-t">
                        <div className="flex gap-3 items-end justify-center h-[55px]">
                          {(malePlaced['sex'] || []).map(chr => (
                            <div key={chr.id} className="scale-75 origin-bottom">
                               <FluorescentChromosome sizeMultiplier={chr.size} type={chr.type} slot="sex" />
                            </div>
                          ))}
                        </div>
                        <span className="mt-1 text-[10px] font-bold text-blue-500">성염색체</span>
                      </div>
                     </div>
                   </div>
                </div>
              </div>
              
              <div className="bg-gray-900 p-6 text-center border-t border-gray-800">
                 <button 
                    onClick={() => setStep('HOME')}
                    className="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-10 rounded-full transition-colors border border-gray-500"
                 >
                   다른 종 연구하러 가기
                 </button>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

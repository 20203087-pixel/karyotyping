<!DOCTYPE html>

<head>

<body class="bg-gray-900 text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 데이터 설정 (개구리 성염색체 수정 완료) ---
    const SPECIES_DATA = {
      frog: {
        id: 'frog', name: '아프리카발톱개구리', diploid: 36,
        femaleSex: 'ZW', maleSex: 'ZZ', // ★ 수정: 암컷 ZW, 수컷 ZZ
        femaleZyg: '이형접합자', maleZyg: '동형접합자', image: '🐸' // ★ 접합 상태 정답도 함께 수정
      },
      fly: {
        id: 'fly', name: '노랑초파리', diploid: 8,
        femaleSex: 'XX', maleSex: 'XY',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🪰'
      },
      chimp: {
        id: 'chimp', name: '침팬지', diploid: 48,
        femaleSex: 'XX', maleSex: 'XY',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🦧'
      },
      gorilla: {
        id: 'gorilla', name: '고릴라', diploid: 48,
        femaleSex: 'XX', maleSex: 'XY',
        femaleZyg: '동형접합자', maleZyg: '이형접합자', image: '🦍'
      }
    };

    // --- 정답 핵형 생성 헬퍼 함수 (결과 화면용 - 개구리 로직 수정) ---
    const generateIdealPlaced = (species, gender) => {
      const idealPlaced = {};
      const autosomePairs = (species.diploid - 2) / 2;

      for (let i = 1; i <= autosomePairs; i++) {
        const sizeMulti = 1 - ((i - 1) / autosomePairs) * 0.6;
        idealPlaced[i.toString()] = [
          { id: `ideal-${gender}-a${i}-1`, type: 'A', slot: i.toString(), size: sizeMulti },
          { id: `ideal-${gender}-a${i}-2`, type: 'A', slot: i.toString(), size: sizeMulti }
        ];
      }

      const sexChromosomes = [];
      if (species.id === 'frog') {
        // ★ 개구리 정답 로직 수정: 암컷 ZW, 수컷 ZZ
        if (gender === 'female') {
          // 암컷은 ZW (서로 다름)
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'Z', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'W', slot: 'sex', size: 0.4 });
        } else {
          // 수컷은 ZZ (서로 같음)
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'Z', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'Z', slot: 'sex', size: 0.9 });
        }
      } else {
        // 나머지 (사람형 XY 시스템)
        if (gender === 'female') {
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'X', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'X', slot: 'sex', size: 0.9 });
        } else {
          sexChromosomes.push({ id: `ideal-${gender}-s-1`, type: 'X', slot: 'sex', size: 0.9 });
          sexChromosomes.push({ id: `ideal-${gender}-s-2`, type: 'Y', slot: 'sex', size: 0.35 });
        }
      }
      idealPlaced['sex'] = sexChromosomes;
      
      return idealPlaced;
    };

    // --- 실제 사진 느낌을 내기 위한 형광 염색체 SVG 컴포넌트 ---
    const FluorescentChromosome = ({ sizeMultiplier, type, slot, showHint }) => {
